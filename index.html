<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1f3b" />
  <title>Quote Decoder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" role="main">
    <h1 class="title">Quote Decoder</h1>
    <div id="status" class="status" role="status" aria-live="polite">Loading a quote&hellip;</div>
    <figure id="quote" class="quote" hidden>
      <blockquote id="quote-text" class="quote-text"></blockquote>
      <figcaption id="quote-author" class="quote-author"></figcaption>
    </figure>
    <button id="next" class="next" type="button" hidden>New quote</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
