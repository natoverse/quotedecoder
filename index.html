<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050d07" />
  <title>Quote Decoder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" role="main">
    <header class="site-header">
      <img class="site-banner" src="assets/banner-hacker.png" alt="Quote Decoder" />
    </header>
    <div id="status" class="status" role="status" aria-live="polite">Loading a quote&hellip;</div>
    <figure id="quote" class="quote" hidden>
      <div id="encoded-text" class="decoder-grid" aria-label="Encoded quote"></div>
    </figure>
    <div class="control-row">
      <button id="settings-btn" class="icon-btn settings-btn" type="button" aria-label="Open settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" />
        </svg>
      </button>
      <button id="hint" class="icon-btn btn-hint" type="button" aria-label="Reveal a letter" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21h6m-5-3h4m3.5-8.5A5.5 5.5 0 0 0 6.8 7.7c-.6 2 .1 4.1 1.7 5.4.9.7 1.5 1.7 1.5 2.9h4c0-1.2.6-2.2 1.5-2.9a5.5 5.5 0 0 0 2-3.6Z" />
        </svg>
      </button>
      <button id="next" class="icon-btn next" type="button" aria-label="Load a new quote" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 7v5h-5m4.1 3a8 8 0 1 1-.6-7.8L20 9" />
        </svg>
      </button>
    </div>
  </main>
  <div id="keyboard" class="keyboard" aria-label="On-screen keyboard" hidden></div>
  <div id="solved-overlay" class="solved-overlay" hidden>
    <div class="solved-panel" role="dialog" aria-modal="true" aria-labelledby="solved-heading">
      <h2 id="solved-heading" class="solved-heading">Solved!</h2>
      <figure class="solved-quote-figure">
        <blockquote id="solved-quote" class="solved-quote"></blockquote>
        <figcaption id="solved-author" class="solved-author"></figcaption>
      </figure>
      <button id="solved-close" type="button" class="solved-close">Dismiss</button>
    </div>
  </div>
  <div id="settings-overlay" class="settings-overlay" hidden>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-heading">
      <h2 id="settings-heading" class="settings-heading">Settings</h2>
      <fieldset class="theme-setting">
        <legend>Theme</legend>
        <div class="theme-options">
          <label>
            <input type="radio" name="theme" value="hacker" />
            <span>Hacker Collective</span>
          </label>
          <label>
            <input type="radio" name="theme" value="glitter" />
            <span>Glitter Shit</span>
          </label>
        </div>
      </fieldset>
      <label class="settings-item">
        <input type="checkbox" id="setting-show-errors" />
        Show errors
      </label>
      <button id="settings-close" type="button" class="settings-close">Close</button>
    </div>
  </div>
  <footer class="site-footer">
    <a href="https://github.com/natoverse/quotedecoder" class="github-link" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>
  <script src="app.js"></script>
</body>
</html>
