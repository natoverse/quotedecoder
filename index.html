<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#130f0d" />
  <title>Quote Decoder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" role="main">
    <h1 class="title">Quote Decoder</h1>
    <div id="status" class="status" role="status" aria-live="polite">Loading a quote&hellip;</div>
    <figure id="quote" class="quote" hidden>
      <p id="decoder-hint" class="decoder-hint">Tap a letter, then pick a replacement.</p>
      <div id="encoded-text" class="decoder-grid" aria-label="Encoded quote"></div>
    </figure>
    <button id="next" class="next" type="button" hidden>New quote</button>
  </main>
  <div id="keyboard" class="keyboard" aria-label="On-screen keyboard" hidden></div>
  <script src="app.js"></script>
</body>
</html>
